name: Keep apps awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Visit and wake apps
        env:
          APP_URLS: |
            https://corridor-tracking.streamlit.app
            https://cadence-ch.streamlit.app
        run: |
          cat > wake.js <<'EOF'
          const { chromium } = require('playwright');

          async function isAwake(page) {
            for (const frame of page.frames()) {
              if (await frame.locator('[data-testid="stApp"]').count()) return true;
            }
            return false;
          }

          async function waitFor(page, check, seconds) {
            for (let i = 0; i < seconds / 5; i++) {
              if (await check()) return true;
              await page.waitForTimeout(5000);
            }
            return false;
          }

          (async () => {
            const urls = process.env.APP_URLS.split('\n').map(s => s.trim()).filter(Boolean);
            const browser = await chromium.launch();
            let failed = false;
            for (const url of urls) {
              const page = await browser.newPage();
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
                const button = page.getByRole('button', { name: /get this app back up/i });
                const settled = await waitFor(page, async () => (await button.count()) > 0 || (await isAwake(page)), 60);
                if (!settled) throw new Error('page did not load the app or the wake button');
                if (await button.count()) {
                  console.log(`${url}: asleep, clicking wake button`);
                  await button.first().click();
                  const woke = await waitFor(page, () => isAwake(page), 300);
                  if (!woke) throw new Error('clicked wake button but app did not start within 5 minutes');
                  console.log(`${url}: woken up`);
                } else {
                  console.log(`${url}: awake`);
                }
                await page.waitForTimeout(20000);
              } catch (e) {
                console.log(`${url}: FAILED - ${e.message}`);
                failed = true;
              }
              await page.close();
            }
            await browser.close();
            if (failed) process.exit(1);
          })();
          EOF
          node wake.js

      - name: Record last run
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-wake
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-wake
          git commit -m "Keep-awake run" || true
          git pull --rebase || true
          git push || true
