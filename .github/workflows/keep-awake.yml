name: Keep apps awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Visit and wake apps
        env:
          APP_URLS: |
            https://YOUR-CORRIDOR-APP.streamlit.app
            https://YOUR-CADENCE-APP.streamlit.app
        run: |
          cat > wake.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const urls = process.env.APP_URLS.split('\n').map(s => s.trim()).filter(Boolean);
            const browser = await chromium.launch();
            let failed = false;
            for (const url of urls) {
              const page = await browser.newPage();
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(5000);
                const button = page.getByRole('button', { name: /get this app back up/i });
                if (await button.count()) {
                  await button.first().click();
                  console.log(`${url}: was asleep, wake requested`);
                  await page.waitForTimeout(90000);
                } else {
                  console.log(`${url}: awake`);
                }
              } catch (e) {
                console.log(`${url}: ${e.message}`);
                failed = true;
              }
              await page.close();
            }
            await browser.close();
            if (failed) process.exit(1);
          })();
          EOF
          node wake.js

      - name: Record last run
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-wake
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-wake
          git commit -m "Keep-awake run" || true
          git push
